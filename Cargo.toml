[package]
name = "telegram-acp"
version = "0.1.0"
edition = "2021"
default-run = "telegram-acp"
license = "MIT"
repository = "https://github.com/SuperKenVery/telegram-acp"
description = "Bridge Telegram and ACP coding agents"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
agent-client-protocol = { version = "0.10", features = ["unstable_session_usage"] }
reqwest = { version = "0.12", features = ["json", "socks"] }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
futures = "0.3"
rmcp = { version = "1.2", features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
telegraph-rs = "0.6"
teloxide = { version = "0.13", features = ["macros"] }
telegram-markdown-v2 = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
